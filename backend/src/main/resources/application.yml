server:
  port: 8080

spring:
  application:
    name: campus-trade
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
  servlet:
    multipart:
      # 容器层放宽到 10MB，由应用层校验 5MB 并返回 70002
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:campus-trade-dev-secret-key-please-change-in-prod-0123456789}
  access-expire: 7200
  refresh-expire: 604800
  issuer: campus-trade

captcha:
  enabled: true

storage:
  type: ${STORAGE_TYPE:local}
  max-file-size: 5242880
  local:
    path: ./uploads
    url-prefix: /files
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: campus-trade
    public-url:

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
