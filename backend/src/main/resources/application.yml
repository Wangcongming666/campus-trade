server:
  port: 8080

spring:
  application:
    name: campus-trade
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
  servlet:
    multipart:
      # 容器层放宽到 10MB，由应用层校验 5MB 并返回 70002
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:campus-trade-dev-secret-key-please-change-in-prod-0123456789}
  access-expire: 7200
  refresh-expire: 604800
  issuer: campus-trade

captcha:
  enabled: true

storage:
  type: ${STORAGE_TYPE:local}
  max-file-size: 5242880
  local:
    path: ./uploads
    url-prefix: /files
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: campus-trade
    public-url:

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# ---------------------------------------------------------------------------
# 后端新增功能的可选配置（均有代码默认值，需要时在 campus: 下追加，注意与已有 campus: 节点合并，不要重复写顶层 campus:）
#   campus.pay.timeout-minutes: 15            # 待付款超时时长（分钟），超时自动取消
#   campus.pay.scan-enabled: true             # 是否开启超时扫描
#   campus.pay.scan-interval-ms: 60000        # 扫描间隔
#   campus.chat.presence-ttl-seconds: 180     # 在线状态心跳有效期
#   campus.chat.presence-heartbeat-ms: 60000  # 在线状态心跳刷新间隔
#   campus.recommend.feed.size: 100           # 首页推荐分页：每用户缓存的候选序列长度
#   campus.recommend.feed.cache-minutes: 10   # 首页推荐分页缓存时长
#   campus.ai.classify.provider: clip         # 图片分类实现 clip | mock | baidu（默认 clip）
#   百度识别密钥：环境变量 BAIDU_AI_API_KEY / BAIDU_AI_SECRET_KEY
# ---------------------------------------------------------------------------

# 图片识别自动分类（CLIP 零样本，离线运行，模型由 scripts/ai/download_model.sh 下载；缺失时自动降级为无建议）
# 注意：如后端另有 campus.ai.classify.* 配置，请合并到同一个 campus.ai 节点下，YAML 不允许重复的 campus 键
campus:
  ai:
    clip:
      enabled: ${CAMPUS_AI_CLIP_ENABLED:true}
      # 相对后端工作目录（backend/）；Docker 部署时挂载模型目录并用环境变量指定绝对路径
      model-dir: ${CAMPUS_AI_CLIP_MODEL_DIR:../scripts/ai/models/clip-vit-base-patch32}
      vision-model: ${CAMPUS_AI_CLIP_VISION_MODEL:vision_model.onnx}
      embeddings: category_embeddings.json
      prompt-ensemble: true
      logit-scale: 100.0
      top-k: 3
      preload: true
      intra-op-threads: 2
      max-concurrent: 2
      acquire-timeout-ms: 5000
      retry-interval-seconds: 300
      max-pixels: 80000000
      category-refresh-seconds: 60
