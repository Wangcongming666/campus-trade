spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trade_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

# 测试环境跳过图形验证码校验（CaptchaFlowTest 中单独开启验证）
captcha:
  enabled: false

storage:
  type: local
  local:
    path: ./target/test-uploads

logging:
  level:
    com.campus.trade: info

# 图片分类测试使用 mock（按文件名关键词）；超时扫描在测试里直接调用 PayService.scanTimeoutOrders()
campus:
  ai:
    classify:
      provider: mock
  pay:
    scan-enabled: false
